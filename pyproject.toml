[project]
name = "vetai-question-flow"
version = "0.1.0"
description = "Pet concern question flow demo: LangChain/Ollama question flow behind a deterministic safety gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
]

# FastAPI serves the implemented HTTP boundary. MLflow and PySide6 arrive only with the
# milestones that need them, so the environment stays as small as the code that exists.

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.7",
]

[tool.uv]
# There is nothing to build or install: the code is imported from src/ by pytest and by the
# run commands in the README. uv still resolves and locks the dependencies above.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ollama: needs a running local Ollama; skipped unless VETAI_RUN_OLLAMA_SMOKE=1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
