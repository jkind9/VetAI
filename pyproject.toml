[project]
name = "vetai-question-flow"
version = "0.1.0"
description = "Pet concern question flow demo: LangChain/Ollama question flow behind a deterministic safety gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The FastAPI backend is the base install. The native desktop client is optional so a backend
# container does not carry GUI libraries. MLflow remains deferred until its tracking milestone.

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.7",
]

[tool.uv]
# Install the source-layout packages so the documented ``python -m frontend.app`` command works.
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/frontend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ollama: needs a running local Ollama; skipped unless VETAI_RUN_OLLAMA_SMOKE=1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
